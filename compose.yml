services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: autocomplete
      POSTGRES_USER: autocomplete
      POSTGRES_PASSWORD: local-demo-only
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["corpus:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocomplete"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports: ["127.0.0.1:56379:6379"]
  api:
    build: backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/autocomplete
      REDIS_HOST: redis
      ANALYTICS_SECRET: ${ANALYTICS_SECRET:-local-demo-analytics-secret-change-before-deployment}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:9090/realms/autocomplete}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-autocomplete-api}
      JWK_SET_URI: ${JWK_SET_URI:-http://localhost:9090/realms/autocomplete/protocol/openid-connect/certs}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  web:
    build: frontend
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  corpus:
