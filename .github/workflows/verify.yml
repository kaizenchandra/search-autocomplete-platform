name: Verify autocomplete
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: autocomplete
          POSTGRES_USER: autocomplete
          POSTGRES_PASSWORD: local-demo-only
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U autocomplete" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
    defaults:
      run:
        working-directory: search-autocomplete-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: mvn -B -f backend/pom.xml '-Dtest=*Test,*IT' verify
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: search-autocomplete-platform/frontend
      - run: npx playwright test
        working-directory: search-autocomplete-platform/frontend
        env:
          WEB_URL: http://127.0.0.1:3000
