apiVersion: apps/v1
kind: Deployment
metadata:
  name: autocomplete
spec:
  replicas: 3
  selector:
    matchLabels: {app: autocomplete}
  template:
    metadata:
      labels: {app: autocomplete}
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          image: autocomplete:1.0.0
          ports: [{containerPort: 8080}]
          envFrom:
            - secretRef: {name: autocomplete-runtime}
          resources:
            requests: {cpu: '1', memory: 1Gi}
            limits: {cpu: '2', memory: 2Gi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /actuator/health, port: 8080}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /api/v1/autocomplete/health, port: 8080}
          livenessProbe:
            tcpSocket: {port: 8080}
---
apiVersion: v1
kind: Service
metadata: {name: autocomplete}
spec:
  selector: {app: autocomplete}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: autocomplete}
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: autocomplete}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: autocomplete}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: autocomplete}
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
